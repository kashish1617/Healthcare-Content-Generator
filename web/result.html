<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Generated Healthcare Document</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, #a5b4fc33, transparent 55%),
                radial-gradient(circle at top right, #6ee7b733, transparent 55%),
                linear-gradient(to bottom right, #f9fafb, #e5f6ff);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
        }

        .soft-card {
            background: rgba(255, 255, 255, 0.95);
        }

        .soft-border {
            border-color: rgba(15, 23, 42, 0.06);
        }
    </style>
</head>

<body class="text-slate-900 min-h-screen">
    <div class="max-w-5xl mx-auto px-4 py-8">
        <header
            class="flex items-center justify-between mb-6 glass-panel rounded-2xl px-4 py-3 border soft-border shadow-sm">
            <div>
                <h1 class="text-xl font-semibold tracking-tight text-slate-900">Generated Healthcare Document</h1>
                <p class="text-xs text-slate-500" id="metaLine"></p>
            </div>
            <button id="backBtn"
                class="text-xs px-3 py-1.5 rounded-full border border-slate-200 text-slate-700 hover:border-emerald-400 hover:text-emerald-700 transition bg-white">
                ← Back to generator
            </button>
        </header>

        <main
            class="soft-card border soft-border rounded-2xl p-5 md:p-6 shadow-lg shadow-slate-200/70 min-h-[260px] flex flex-col">
            <div class="flex items-center justify-between mb-3">
                <div>
                    <h2 class="text-sm font-semibold text-slate-900" id="titleLine">Document</h2>
                    <p class="text-base md:text-xl text-slate-700" id="subtitleLine"></p>
                </div>
                <div class="flex gap-2">
                    <!-- <button id="copyBtn" </button> class="text-[11px] px-3 py-1.5 rounded-full border border-slate-200
                        text-slate-700 hover:border-emerald-400 hover:text-emerald-700 transition bg-white">
                        Copy text
                    </button> -->
                    <button id="downloadBtn"
                        class="text-[11px] px-3 py-1.5 rounded-full border border-slate-200 text-slate-700 hover:border-emerald-400 hover:text-emerald-700 transition bg-white">
                        Download as .txt
                    </button>
                </div>
            </div>

            <div id="outputBox"
                class="flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm md:text-base text-slate-900 overflow-auto leading-relaxed">
            </div>
        </main>
    </div>

    <script>
        const raw = sessionStorage.getItem("hcg_result");
        if (!raw) {
            // If no stored result, go back to generator (supports both file and http).
            if (window.location.protocol === "file:") {
                window.location.href = "index.html";
            } else {
                window.location.href = "/";
            }
        }

        const data = raw ? JSON.parse(raw) : null;

        const metaLine = document.getElementById("metaLine");
        const titleLine = document.getElementById("titleLine");
        const subtitleLine = document.getElementById("subtitleLine");
        const outputBox = document.getElementById("outputBox");
        const copyBtn = document.getElementById("copyBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const backBtn = document.getElementById("backBtn");

        function escapeHtml(s) {
            return String(s)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function renderReport(content) {
            const lines = String(content || "").split(/\r?\n/);
            // Match headings even if model adds hashes, numbers or punctuation, e.g. "### Summary", "1. Summary:"
            const headingStartRe = /^\s*(?:#{1,6}\s*)?(?:\d+\.)?\s*(summary|treatment|precautions)\b[:\-]?\s*(.*)$/i;
            // Match bullet lines like "* **Aspirin:** 324 mg ..."
            const bulletHeadingRe = /^\s*[\*\-]\s*\*\*(.+?):\*\*\s*(.*)$/;

            const html = lines.map((line) => {
                const headingMatch = headingStartRe.exec(line);
                if (headingMatch) {
                    const heading = headingMatch[1];         // Summary / Treatment / Precautions
                    const rest = headingMatch[2] || "";      // Any text after the heading
                    const headingHtml = `<div class="mt-4 text-lg md:text-xl font-semibold text-slate-900">${escapeHtml(heading)}</div>`;
                    if (!rest.trim()) {
                        return headingHtml;
                    }
                    const restHtml = `<div class="text-sm md:text-base text-slate-900 leading-relaxed mt-1">${escapeHtml(rest)}</div>`;
                    return headingHtml + restHtml;
                }

                const bulletMatch = bulletHeadingRe.exec(line);
                if (bulletMatch) {
                    const label = bulletMatch[1].trim();
                    const rest = bulletMatch[2] || "";
                    return `<div class="text-sm md:text-base text-slate-900 leading-relaxed"><span class="font-semibold">${escapeHtml(label)}:</span> ${escapeHtml(rest)}</div>`;
                }

                if (!line.trim()) return `<div class="h-2"></div>`;
                return `<div class="text-sm md:text-base text-slate-900 leading-relaxed">${escapeHtml(line)}</div>`;
            }).join("");

            outputBox.innerHTML =
                html || `<div class="text-sm md:text-base text-slate-900">(No content returned.)</div>`;
        }

        if (data) {
            const dt = data.generated_at ? new Date(data.generated_at) : new Date();
            const formattedDate = dt.toLocaleString(undefined, {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });

            const label =
                data.content_type === "patient_summary" ? "Patient Summary" :
                    data.content_type === "clinical_note" ? "Clinical Note" :
                        data.content_type === "education_handout" ? "Education Handout" :
                            "Generated document";

            metaLine.textContent = `Generated on ${formattedDate}`;
            titleLine.textContent = label;

            let subtitle = "";
            const p = data.patient || {};
            if (p.name) subtitle += `<strong>Patient:</strong> ${p.name}`;
            if (p.age) subtitle += (subtitle ? " • " : "") + `<strong>Age:</strong> ${p.age} years`;
            if (p.visit_date) subtitle += (subtitle ? " • " : "") + `<strong>Visit:</strong> ${p.visit_date}`;
            if (p.provider) subtitle += (subtitle ? " • " : "") + `<strong>Provider:</strong> ${p.provider}`;
            const vitals = [];
            if (p.bp) vitals.push(`<strong>BP:</strong> ${p.bp}`);
            if (p.hr) vitals.push(`<strong>HR:</strong> ${p.hr}`);
            if (p.temp) vitals.push(`<strong>Temp:</strong> ${p.temp}`);
            if (vitals.length) subtitle += (subtitle ? " • " : "") + vitals.join(", ");
            subtitleLine.innerHTML = subtitle || (data.topic ? `<strong>Topic:</strong> ${data.topic}` : "");
            renderReport(data.content);
        }

        copyBtn.addEventListener("click", async () => {
            const text = outputBox.textContent || "";
            if (!text.trim()) return;
            try {
                await navigator.clipboard.writeText(text);
                copyBtn.textContent = "Copied!";
                setTimeout(() => (copyBtn.textContent = "Copy text"), 1200);
            } catch {
                alert("Copy failed. Please copy manually.");
            }
        });

        downloadBtn.addEventListener("click", () => {
            const text = outputBox.textContent || "";
            if (!text.trim()) return;
            const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "healthcare_content.txt";
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        });

        backBtn.addEventListener("click", () => {
            if (window.location.protocol === "file:") {
                window.location.href = "index.html";
            } else {
                window.location.href = "/";
            }
        });
    </script>
</body>

</html>
